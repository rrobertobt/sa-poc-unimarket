version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unimarket
      POSTGRES_PASSWORD: unimarket
      POSTGRES_DB: unimarket
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimarket -d unimarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      CLOUD_PROVIDER: local
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: unimarket
      DB_PASSWORD: unimarket
      DB_NAME: unimarket
      DB_SSL: "false"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_URL: http://localhost:8080
    ports:
      - "5173:80"

volumes:
  db_data:
