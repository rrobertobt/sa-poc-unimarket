services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unimarket
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: unimarket
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimarket -d unimarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: rrobertobt/unimarket-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      CLOUD_PROVIDER: oci
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: unimarket
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: unimarket
      DB_SSL: "false"
    ports:
      - "8080:8080"

  frontend:
    image: rrobertobt/unimarket-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
